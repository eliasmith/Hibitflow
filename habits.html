<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Habits</title>
<style>
  :root {
    --ground: #DDE6EA;
    --surface: #F3F7F8;
    --ink: #14232E;
    --muted: #51636F;
    --line: #BCCAD2;
    --track: #C9D6DC;
    --accent: #1F4FD8;
    --accent-ink: #FFFFFF;
    --gold: #E8A317;
    --danger: #B42318;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0F1A22;
      --surface: #172630;
      --ink: #E3EDF2;
      --muted: #93A6B3;
      --line: #2A3E4B;
      --track: #213441;
      --accent: #7AA2FF;
      --accent-ink: #0F1A22;
      --gold: #F2B84B;
      --danger: #FF8A80;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Bahnschrift", "DIN Alternate", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 72px; }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
  h1 {
    margin: 0;
    font-size: clamp(32px, 8vw, 46px);
    line-height: 1.05;
    font-weight: 650;
    letter-spacing: -0.01em;
    font-variation-settings: "wdth" 80;
  }
  .sub { margin: 8px 0 0; color: var(--muted); font-size: 17px; }
  .nav { display: flex; gap: 6px; flex-shrink: 0; padding-top: 4px; }
  .icon, .btn {
    height: 40px;
    border: 1.5px solid var(--line);
    background: transparent;
    border-radius: 10px;
    display: inline-grid;
    place-items: center;
  }
  .icon { width: 40px; }
  .btn { padding: 0 16px; font-weight: 600; height: 44px; }
  .nav .btn { height: 40px; padding: 0 14px; }
  .icon:hover:not(:disabled), .btn:hover:not(:disabled) { background: var(--surface); }
  .icon:disabled { opacity: 0.35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }

  /* Week strip: each column fills as the day's habits get done */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 36px; }
  .day {
    border: 0; background: none; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .bar {
    position: relative; overflow: hidden; width: 100%; height: 96px;
    background: var(--track); border-radius: 10px;
  }
  .fill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0;
    background: var(--accent); transition: height 0.3s ease;
  }
  .day.full .fill { background: var(--gold); }
  .day.sel .bar { box-shadow: 0 0 0 2px var(--ink); }
  .day:disabled { opacity: 0.4; cursor: default; }
  .dow { font-size: 13px; color: var(--muted); }
  .num { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .day.sel .dow { color: var(--ink); font-weight: 600; }
  .day.today .num { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }

  /* Habit list */
  h2 { margin: 0; font-size: 20px; font-weight: 650; }
  .listhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .hint { margin: 0; color: var(--muted); font-size: 14px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .habit {
    display: grid;
    grid-template-columns: 44px 1fr auto 36px;
    column-gap: 14px; row-gap: 12px; align-items: center;
    padding: 16px 0; border-bottom: 1px solid var(--line);
  }
  .check {
    width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid var(--muted); background: transparent;
    display: grid; place-items: center; color: var(--accent-ink);
    transition: background 0.15s, border-color 0.15s;
  }
  .check svg { opacity: 0; transition: opacity 0.15s; }
  .check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .check[aria-pressed="true"] svg { opacity: 1; }
  .check:hover:not(:disabled) { border-color: var(--accent); }
  .check:disabled { opacity: 0.4; cursor: default; border-style: dashed; }
  .name { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .streak { text-align: right; }
  .streak strong { display: block; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
  .streak span { font-size: 12px; color: var(--muted); }
  .streak.zero strong { color: var(--muted); }
  .edit {
    width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent;
    color: var(--muted); display: grid; place-items: center;
  }
  .edit:hover { background: var(--surface); color: var(--ink); }
  .history { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(28, 1fr); gap: 3px; }
  .history i { height: 10px; border-radius: 2px; border: 1px solid transparent; }
  .history i.on { background: var(--accent); border-color: var(--accent); }
  .history i.miss { background: var(--track); border-color: var(--track); }
  .history i.off { border: 1px dashed var(--line); }
  .none { padding: 18px 0; color: var(--muted); border-bottom: 1px solid var(--line); }

  .empty { padding: 4px 0 8px; }
  .empty p { margin: 0 0 12px; font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 15px; }
  .chip:hover { background: var(--surface); }

  /* Add form */
  .add { margin-top: 44px; }
  .addrow { display: flex; gap: 10px; margin-top: 12px; }
  input[type="text"] {
    flex: 1; min-width: 0; height: 46px; padding: 0 14px;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; font-size: 16px;
  }
  input[type="text"]::placeholder { color: var(--muted); }
  .dayslabel { margin: 16px 0 8px; font-size: 14px; color: var(--muted); }
  .days { display: flex; flex-wrap: wrap; gap: 6px; }
  .daychip {
    height: 36px; min-width: 46px; padding: 0 10px;
    border: 1.5px solid var(--line); background: transparent; border-radius: 8px; font-size: 14px;
  }
  .daychip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); font-weight: 600; }
  .msg { min-height: 1.45em; margin: 10px 0 0; font-size: 14px; color: var(--danger); }

  /* Footer */
  footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  footer p { margin: 0 0 10px; }
  .linkbtn { background: none; border: 0; padding: 0; margin-right: 16px; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }
  #status { color: var(--ink); min-height: 1.45em; }

  /* Edit dialog */
  dialog {
    border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--ink);
    width: min(440px, calc(100vw - 32px));
  }
  dialog::backdrop { background: rgba(10, 20, 28, 0.55); }
  .dlg { padding: 24px; }
  .dlg label { display: block; margin: 16px 0 8px; font-size: 14px; color: var(--muted); }
  .dlg input[type="text"] { width: 100%; flex: none; background: var(--ground); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .actions .spacer { flex: 1; }
  .warn { margin: 16px 0 0; font-size: 14px; color: var(--danger); }

  @media (max-width: 480px) {
    .wrap { padding: 20px 16px 64px; }
    .history { grid-column: 1 / -1; }
    .listhead { flex-direction: column; gap: 2px; }
    .week { gap: 5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<noscript>This habit tracker needs JavaScript turned on.</noscript>

<main class="wrap">
  <header class="top">
    <div>
      <h1 id="dayTitle"></h1>
      <p class="sub" id="daySub" aria-live="polite"></p>
    </div>
    <div class="nav">
      <button class="icon" id="prevWeek" type="button" aria-label="Previous week">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="btn" id="todayBtn" type="button">Today</button>
      <button class="icon" id="nextWeek" type="button" aria-label="Next week">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </header>

  <div class="week" id="week" role="group" aria-label="Pick a day"></div>

  <section aria-labelledby="habitsHead">
    <div class="listhead">
      <h2 id="habitsHead">Habits</h2>
      <p class="hint" id="hint">Squares show the last 28 days.</p>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>
      <p>Start with one habit you can finish in two minutes.</p>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <section class="add" aria-labelledby="addHead">
    <h2 id="addHead">New habit</h2>
    <div class="addrow">
      <input id="newName" type="text" maxlength="60" placeholder="e.g. Read 10 pages" autocomplete="off" aria-label="Habit name">
      <button class="btn primary" id="addBtn" type="button">Add habit</button>
    </div>
    <div class="dayslabel" id="addDaysLabel">Repeat on</div>
    <div class="days" id="addDays" role="group" aria-labelledby="addDaysLabel"></div>
    <p class="msg" id="addMsg" role="alert"></p>
  </section>

  <footer>
    <p id="saveNote">Your habits are saved in this browser. Export a backup before clearing site data.</p>
    <p id="status" role="status"></p>
    <button class="linkbtn" id="exportBtn" type="button">Export backup</button>
    <button class="linkbtn" id="importBtn" type="button">Import backup</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </footer>
</main>

<dialog id="editDlg" aria-labelledby="editHead">
  <div class="dlg">
    <h2 id="editHead">Edit habit</h2>
    <label for="editName">Name</label>
    <input id="editName" type="text" maxlength="60" autocomplete="off">
    <label id="editDaysLabel">Repeat on</label>
    <div class="days" id="editDays" role="group" aria-labelledby="editDaysLabel"></div>
    <p class="msg" id="editMsg" role="alert"></p>
    <p class="warn" id="deleteWarn" hidden>This removes the habit and all of its history.</p>
    <div class="actions">
      <button class="btn danger" id="deleteBtn" type="button">Delete habit</button>
      <span class="spacer"></span>
      <button class="btn" id="cancelEdit" type="button">Cancel</button>
      <button class="btn primary" id="saveEdit" type="button">Save changes</button>
    </div>
  </div>
</dialog>

<script>
(() => {
  'use strict';

  const KEY = 'habits.v1';
  const $ = (id) => document.getElementById(id);

  // ---------- Dates (local time, Monday = 0) ----------
  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const dowIdx = (k) => (parse(k).getDay() + 6) % 7;
  const weekStart = (k) => addDays(k, -dowIdx(k));
  const today = () => keyOf(new Date());
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const dayName = (i, style) => new Date(2024, 0, 1 + i).toLocaleDateString(undefined, { weekday: style });
  const fmtLong = (k) => parse(k).toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });

  // ---------- Storage (falls back to memory if the browser blocks it) ----------
  let persisted = true;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function sanitize(o) {
    if (!o || !Array.isArray(o.habits)) throw new Error('Not a habits file');
    const habits = [];
    for (const h of o.habits) {
      if (!h || typeof h.name !== 'string' || !h.name.trim()) continue;
      let days = Array.isArray(h.days) ? [...new Set(h.days.filter((n) => Number.isInteger(n) && n >= 0 && n <= 6))].sort() : [];
      if (!days.length) days = [0, 1, 2, 3, 4, 5, 6];
      const done = {};
      if (h.done && typeof h.done === 'object') {
        for (const k of Object.keys(h.done)) if (DATE_RE.test(k) && h.done[k]) done[k] = 1;
      }
      const firstDone = Object.keys(done).sort()[0];
      let created = DATE_RE.test(h.created) ? h.created : (firstDone || today());
      if (firstDone && firstDone < created) created = firstDone;
      const id = String(h.id || '').replace(/[^\w-]/g, '') || uid();
      habits.push({ id, name: h.name.trim().slice(0, 60), days, created, done });
    }
    return { habits };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return sanitize(JSON.parse(raw));
    } catch (e) { /* fall through */ }
    try { localStorage.getItem(KEY); } catch (e) { persisted = false; }
    return { habits: [] };
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); persisted = true; }
    catch (e) { persisted = false; }
    $('saveNote').textContent = persisted
      ? 'Your habits are saved in this browser. Export a backup before clearing site data.'
      : "Changes can't be saved in this view and will be lost when you close the tab. Open the file in your own browser to keep them.";
  }

  let state = load();
  let sel = today();
  let editingId = null;
  let deleteArmed = false;
  const heights = {};

  // ---------- Habit logic ----------
  const find = (id) => state.habits.find((h) => h.id === id);
  const isSched = (h, k) => k >= h.created && h.days.includes(dowIdx(k));

  function dayStats(k) {
    const sched = state.habits.filter((h) => isSched(h, k));
    return { total: sched.length, done: sched.filter((h) => h.done[k]).length };
  }

  function streaks(h) {
    const t = today();
    let cur = 0, day = t, guard = 0;
    while (day >= h.created && guard++ < 5000) {
      if (isSched(h, day)) {
        if (h.done[day]) cur++;
        else if (day !== t) break;   // today may still be completed
      }
      day = addDays(day, -1);
    }
    let best = 0, run = 0;
    day = h.created;
    guard = 0;
    while (day <= t && guard++ < 5000) {
      if (isSched(h, day)) {
        if (h.done[day]) { run++; if (run > best) best = run; }
        else if (day !== t) run = 0;
      }
      day = addDays(day, 1);
    }
    return { cur, best };
  }

  function scheduleText(h) {
    if (h.days.length === 7) return 'Every day';
    if (h.days.join() === '0,1,2,3,4') return 'Weekdays';
    if (h.days.join() === '5,6') return 'Weekends';
    return h.days.map((i) => dayName(i, 'short')).join(', ');
  }

  // ---------- DOM helper (user text is only ever set via textContent) ----------
  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v === false || v == null) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
    return n;
  }
  const CHECK_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const PENCIL_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
  const focusBy = (sel_) => { const n = document.querySelector(sel_); if (n) n.focus(); };

  // ---------- Rendering ----------
  function renderHeader() {
    const t = today();
    const { total, done } = dayStats(sel);
    $('dayTitle').textContent = fmtLong(sel);
    let sub;
    if (!state.habits.length) sub = 'No habits yet.';
    else if (!total) sub = 'Nothing scheduled for this day.';
    else if (done === total) sub = sel === t ? 'All done for today.' : 'All done.';
    else sub = `${done} of ${total} done${sel === t ? ' today' : ''}`;
    $('daySub').textContent = sub;
    $('nextWeek').disabled = weekStart(sel) >= weekStart(t);
    $('todayBtn').disabled = sel === t;
  }

  function renderWeek() {
    const t = today();
    const ws = weekStart(sel);
    const week = $('week');
    week.replaceChildren();
    for (let i = 0; i < 7; i++) {
      const k = addDays(ws, i);
      const future = k > t;
      const { total, done } = dayStats(k);
      const pct = future || !total ? 0 : Math.round((done / total) * 100);
      const fill = el('span', { class: 'fill' });
      const prev = heights[k] ?? pct;
      fill.style.height = prev + '%';
      heights[k] = pct;
      if (prev !== pct) requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.height = pct + '%'; }));
      const status = future ? 'upcoming' : total ? `${done} of ${total} done` : 'nothing scheduled';
      week.append(el('button', {
        type: 'button',
        class: 'day' + (k === sel ? ' sel' : '') + (k === t ? ' today' : '') + (total && done === total && !future ? ' full' : ''),
        'aria-pressed': String(k === sel),
        'aria-label': `${fmtLong(k)}, ${status}`,
        'data-k': k,
        disabled: future,
        onclick: () => { sel = k; render(); focusBy(`.day[data-k="${k}"]`); },
      },
        el('span', { class: 'bar' }, fill),
        el('span', { class: 'dow', text: dayName(i, 'short') }),
        el('span', { class: 'num', text: String(parse(k).getDate()) })
      ));
    }
  }

  function renderList() {
    const t = today();
    const list = $('list');
    list.replaceChildren();
    const has = state.habits.length > 0;
    list.hidden = !has;
    $('empty').hidden = has;
    $('hint').hidden = !has;

    const shown = state.habits.filter((h) => h.created <= sel);
    if (has && !shown.length) list.append(el('li', { class: 'none', text: 'No habits were tracked on this day.' }));

    for (const h of shown) {
      const sched = isSched(h, sel);
      const done = !!h.done[sel];
      const { cur, best } = streaks(h);

      const check = el('button', {
        type: 'button', class: 'check', 'data-id': h.id, 'data-role': 'check',
        'aria-pressed': String(done),
        'aria-label': sched ? h.name : `${h.name} (not scheduled on this day)`,
        disabled: !sched,
        onclick: () => toggle(h.id),
      });
      check.innerHTML = CHECK_SVG;

      const edit = el('button', {
        type: 'button', class: 'edit', 'data-id': h.id, 'data-role': 'edit',
        'aria-label': `Edit ${h.name}`, onclick: () => openEdit(h.id),
      });
      edit.innerHTML = PENCIL_SVG;

      const cells = [];
      for (let i = 27; i >= 0; i--) {
        const d = addDays(t, -i);
        const cls = h.done[d] ? 'on' : isSched(h, d) ? 'miss' : 'off';
        const label = parse(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        cells.push(el('i', { class: cls, title: cls === 'off' ? '' : `${label}: ${cls === 'on' ? 'done' : 'missed'}` }));
      }

      list.append(el('li', { class: 'habit' },
        check,
        el('div', {},
          el('div', { class: 'name', text: h.name }),
          el('div', { class: 'meta' },
            el('span', { text: sched ? scheduleText(h) : 'Rest day' }),
            best > 0 ? el('span', { text: `Best ${best} in a row` }) : null)),
        el('div', { class: 'streak' + (cur === 0 ? ' zero' : '') },
          el('strong', { text: String(cur) }),
          el('span', { text: 'in a row' })),
        edit,
        el('div', { class: 'history', 'aria-hidden': 'true' }, cells)
      ));
    }
  }

  function render() { renderHeader(); renderWeek(); renderList(); }

  function say(msg) { $('status').textContent = msg; }

  // ---------- Actions ----------
  function toggle(id) {
    const h = find(id);
    if (!h || !isSched(h, sel)) return;
    if (h.done[sel]) delete h.done[sel]; else h.done[sel] = 1;
    save(); render();
    focusBy(`[data-id="${id}"][data-role="check"]`);
  }

  function dayChips(container, selected) {
    container.replaceChildren();
    for (let i = 0; i < 7; i++) {
      container.append(el('button', {
        type: 'button', class: 'daychip', 'data-i': i,
        'aria-pressed': String(selected.includes(i)),
        'aria-label': dayName(i, 'long'),
        text: dayName(i, 'short'),
        onclick: (e) => {
          const b = e.currentTarget;
          b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
        },
      }));
    }
  }
  const readDays = (container) => [...container.querySelectorAll('[aria-pressed="true"]')].map((b) => Number(b.dataset.i));
  const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];

  function addHabit() {
    const name = $('newName').value.trim();
    const days = readDays($('addDays'));
    if (!name) { $('addMsg').textContent = 'Enter a habit name.'; $('newName').focus(); return; }
    if (!days.length) { $('addMsg').textContent = 'Pick at least one day.'; return; }
    state.habits.push({ id: uid(), name, days, created: sel, done: {} });
    $('newName').value = '';
    $('addMsg').textContent = '';
    dayChips($('addDays'), ALL_DAYS);
    save(); render();
    say(`Added "${name}".`);
    $('newName').focus();
  }

  // ---------- Edit dialog ----------
  const dlg = $('editDlg');

  function openEdit(id) {
    const h = find(id);
    if (!h) return;
    editingId = id;
    deleteArmed = false;
    $('editName').value = h.name;
    dayChips($('editDays'), h.days);
    $('editMsg').textContent = '';
    $('deleteWarn').hidden = true;
    $('deleteBtn').textContent = 'Delete habit';
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
    $('editName').focus();
  }

  function closeEdit() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }

  function saveEdit() {
    const h = find(editingId);
    if (!h) return closeEdit();
    const name = $('editName').value.trim();
    const days = readDays($('editDays'));
    if (!name) { $('editMsg').textContent = 'Enter a habit name.'; return; }
    if (!days.length) { $('editMsg').textContent = 'Pick at least one day.'; return; }
    h.name = name;
    h.days = days;
    save(); closeEdit(); render();
    focusBy(`[data-id="${h.id}"][data-role="edit"]`);
  }

  function deleteHabit() {
    if (!deleteArmed) {
      deleteArmed = true;
      $('deleteWarn').hidden = false;
      $('deleteBtn').textContent = 'Yes, delete habit';
      return;
    }
    const h = find(editingId);
    state.habits = state.habits.filter((x) => x.id !== editingId);
    editingId = null;
    save(); closeEdit(); render();
    if (h) say(`Deleted "${h.name}".`);
  }

  // ---------- Backup ----------
  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: `habits-${today()}.json` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    say('Backup exported.');
  }

  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const next = sanitize(JSON.parse(reader.result));
        state = next; save(); render();
        say(`Imported ${next.habits.length} ${next.habits.length === 1 ? 'habit' : 'habits'}. Your previous habits were replaced.`);
      } catch (e) {
        say("That file isn't a habits backup. Choose a file you exported from this app.");
      }
    };
    reader.onerror = () => say("The file couldn't be read. Try exporting a new backup and importing that.");
    reader.readAsText(file);
  }

  // ---------- Wiring ----------
  $('prevWeek').addEventListener('click', () => { sel = addDays(sel, -7); render(); $('prevWeek').focus(); });
  $('nextWeek').addEventListener('click', () => {
    const n = addDays(sel, 7); sel = n > today() ? today() : n; render();
    if (!$('nextWeek').disabled) $('nextWeek').focus();
  });
  $('todayBtn').addEventListener('click', () => { sel = today(); render(); });
  $('addBtn').addEventListener('click', addHabit);
  $('newName').addEventListener('keydown', (e) => { if (e.key === 'Enter') addHabit(); });
  $('newName').addEventListener('input', () => { $('addMsg').textContent = ''; });
  $('saveEdit').addEventListener('click', saveEdit);
  $('cancelEdit').addEventListener('click', closeEdit);
  $('deleteBtn').addEventListener('click', deleteHabit);
  $('editName').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveEdit(); });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) closeEdit(); });
  $('exportBtn').addEventListener('click', exportData);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) importData(f);
    e.target.value = '';
  });
  window.addEventListener('focus', render);   // refresh if the page stayed open past midnight

  ['Drink a glass of water', 'Walk outside', 'Read 10 pages', 'Stretch'].forEach((t) => {
    $('chips').append(el('button', {
      type: 'button', class: 'chip', text: t,
      onclick: () => { $('newName').value = t; $('newName').focus(); },
    }));
  });

  dayChips($('addDays'), ALL_DAYS);
  save();
  render();
})();
</script>
</body>
</html>
